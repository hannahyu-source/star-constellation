<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사계절 별자리 - 북반구 별자리 여행</title>
<style>
  :root{
    --bg-deep:#05070f;
    --bg-panel:#0d1226;
    --bg-panel-2:#131a35;
    --line:#2a3468;
    --star:#f5f7ff;
    --accent:#7dd3fc;
    --accent-2:#fbbf24;
    --accent-3:#a78bfa;
    --text:#e7ebff;
    --text-dim:#9aa4d0;
    --spring:#f9a8d4;
    --summer:#67e8f9;
    --autumn:#fdba74;
    --winter:#c4b5fd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at 50% -10%, #131a3d 0%, #05070f 55%, #020308 100%);
    color:var(--text);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  #bgstars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 20px 60px;}

  header{text-align:center;margin-bottom:22px;}
  header h1{
    font-size:clamp(1.6rem,3.4vw,2.4rem);
    margin:0 0 6px;
    letter-spacing:0.5px;
    background:linear-gradient(90deg,#fbbf24,#f9a8d4,#67e8f9,#c4b5fd);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:800;
  }
  header p{color:var(--text-dim);margin:0;font-size:0.95rem;}

  nav.seasons{
    display:flex;justify-content:center;gap:10px;margin:26px 0 20px;flex-wrap:wrap;
  }
  nav.seasons button{
    appearance:none;border:1px solid var(--line);background:var(--bg-panel);
    color:var(--text-dim);padding:10px 18px;border-radius:999px;font-size:0.95rem;
    cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .25s ease;
    font-weight:600;
  }
  nav.seasons button:hover{color:var(--text);border-color:var(--accent);}
  nav.seasons button.active{
    color:#05070f;background:var(--season-color,var(--accent));border-color:transparent;
    box-shadow:0 0 22px -4px var(--season-color,var(--accent));
  }

  .season-header{text-align:center;margin-bottom:18px;}
  .season-header h2{font-size:1.4rem;margin:0 0 4px;color:var(--season-color);}
  .season-header span{color:var(--text-dim);font-size:0.88rem;}

  .layout{
    display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:22px;
    align-items:start;
  }
  @media (max-width:880px){
    .layout{grid-template-columns:1fr;}
  }

  .stage{
    background:linear-gradient(180deg,var(--bg-panel) 0%, #080b18 100%);
    border:1px solid var(--line);border-radius:18px;padding:14px;
    position:relative;overflow:hidden;
  }
  .stage-toolbar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-bottom:10px;flex-wrap:wrap;
  }
  .toolbar-toggles{display:flex;gap:8px;flex-wrap:wrap;}
  .toggle-btn{
    border:1px solid var(--line);background:var(--bg-panel-2);color:var(--text-dim);
    border-radius:8px;padding:6px 12px;font-size:0.8rem;cursor:pointer;transition:.2s;
  }
  .toggle-btn.on{background:var(--season-color);color:#05070f;border-color:transparent;font-weight:700;}
  .hint{font-size:0.78rem;color:var(--text-dim);}

  svg.skymap{width:100%;height:auto;display:block;border-radius:12px;background:
    radial-gradient(circle at 20% 20%, rgba(125,211,252,0.05), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(249,168,212,0.05), transparent 45%),
    #060812;
  }
  .con-line{stroke:var(--line);stroke-width:2;fill:none;transition:stroke .3s, stroke-width .3s, opacity .3s;opacity:.55;}
  .con-group.active .con-line{stroke:var(--season-color);stroke-width:2.6;opacity:1;}
  .con-group{cursor:pointer;}
  .star-dot{fill:var(--star);transition:r .2s, filter .2s;}
  .con-group .star-dot{filter:drop-shadow(0 0 2px rgba(255,255,255,0.5));}
  .con-group.active .star-dot{filter:drop-shadow(0 0 6px var(--season-color));}
  .con-group:hover .star-dot{filter:drop-shadow(0 0 8px var(--season-color));}
  .star-label{
    fill:var(--text-dim);font-size:11px;pointer-events:none;opacity:0;transition:opacity .25s;
    font-family:inherit;
  }
  .show-labels .star-label{opacity:1;}
  .con-name-label{
    fill:var(--season-color);font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;
    pointer-events:none;
  }
  .con-group.active .con-name-label, .con-group:hover .con-name-label{opacity:1;}
  .asterism-line{
    stroke-width:1.6;stroke-dasharray:6 6;fill:none;opacity:.85;
    pointer-events:none;
  }
  .asterism-label{font-size:12px;opacity:1;pointer-events:none;font-weight:700;}

  .tooltip{
    position:absolute;pointer-events:none;background:#10152b;border:1px solid var(--accent);
    color:var(--text);padding:6px 10px;border-radius:8px;font-size:0.78rem;
    transform:translate(-50%,-130%);opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5;
  }
  .tooltip.show{opacity:1;}

  .sidebar{display:flex;flex-direction:column;gap:14px;}
  .con-list{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;padding:10px;
    display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto;
  }
  .con-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;
    color:var(--text-dim);transition:.2s;
  }
  .con-item:hover{background:var(--bg-panel-2);color:var(--text);}
  .con-item.active{background:var(--bg-panel-2);border-color:var(--season-color);color:var(--text);}
  .con-item .kor{font-weight:700;}
  .con-item .eng{font-size:0.75rem;color:var(--text-dim);}

  .info-card{
    background:linear-gradient(180deg,var(--bg-panel) 0%,#0a0e20 100%);
    border:1px solid var(--line);border-radius:16px;padding:18px;min-height:260px;
  }
  .info-card h3{margin:0 0 2px;font-size:1.25rem;color:var(--season-color);}
  .info-card .eng-name{color:var(--text-dim);font-size:0.85rem;margin-bottom:12px;display:block;}
  .info-row{display:flex;gap:8px;margin-bottom:10px;font-size:0.85rem;}
  .info-row .label{color:var(--text-dim);min-width:64px;flex-shrink:0;}
  .info-card p.desc{font-size:0.88rem;line-height:1.6;color:var(--text);margin:10px 0;}
  .info-card p.myth{font-size:0.84rem;line-height:1.65;color:var(--text-dim);
    background:rgba(255,255,255,0.03);border-left:3px solid var(--season-color);
    padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0 0;}
  .info-card p.deepsky{font-size:0.82rem;line-height:1.6;color:var(--accent);margin:10px 0 0;}
  .placeholder{color:var(--text-dim);font-size:0.9rem;text-align:center;padding:40px 10px;}
  #asterismToggles{display:contents;}

  footer{text-align:center;color:var(--text-dim);font-size:0.78rem;margin-top:30px;}
</style>
</head>
<body>
<canvas id="bgstars"></canvas>
<div class="wrap">
  <header>
    <h1>✦ 사계절 별자리 여행 ✦</h1>
    <p>북반구 중위도에서 계절마다 저녁 하늘에 떠오르는 대표 별자리를 살펴보세요</p>
  </header>

  <nav class="seasons" id="seasonNav"></nav>

  <div class="season-header">
    <h2 id="seasonTitle"></h2>
    <span id="seasonSubtitle"></span>
  </div>

  <div class="layout">
    <div class="stage">
      <div class="stage-toolbar">
        <div class="toolbar-toggles">
          <button class="toggle-btn" id="toggleLabels">별 이름 보기</button>
          <div class="toolbar-toggles" id="asterismToggles"></div>
        </div>
        <span class="hint">별자리를 클릭하면 자세한 설명을 볼 수 있어요</span>
      </div>
      <div style="position:relative;">
        <svg class="skymap" id="skymap" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </div>

    <div class="sidebar">
      <div class="con-list" id="conList"></div>
      <div class="info-card" id="infoCard">
        <div class="placeholder">별자리를 선택하면<br>여기에 설명이 나타납니다 ✨</div>
      </div>
    </div>
  </div>

  <footer>계절별 별자리 위치는 이해를 돕기 위해 단순화하여 표현했습니다 · 북반구 중위도(약 위도 35~40°) 기준 · 별자리 정보는 Star Walk, 국립부산과학관 자료를 참고했습니다</footer>
</div>

/* --------------- Background twinkle canvas --------------- */
const bgCanvas = document.getElementById('bgstars');
const bgCtx = bgCanvas.getContext('2d');
let bgParticles = [];
function resizeBg(){
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = document.body.scrollHeight;
  bgParticles = Array.from({length: Math.floor(bgCanvas.width*bgCanvas.height/9000)}, () => ({
    x: Math.random()*bgCanvas.width,
    y: Math.random()*bgCanvas.height,
    r: Math.random()*1.3+0.2,
    speed: Math.random()*0.02+0.005,
    phase: Math.random()*Math.PI*2
  }));
}
function drawBg(t){
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  for(const p of bgParticles){
    const alpha = 0.35 + 0.65*Math.abs(Math.sin(p.phase + t*p.speed));
    bgCtx.beginPath();
    bgCtx.fillStyle = `rgba(230,235,255,${alpha.toFixed(2)})`;
    bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgCtx.fill();
  }
  requestAnimationFrame(drawBg);
}
window.addEventListener('resize', resizeBg);
resizeBg();
requestAnimationFrame(drawBg);

/* --------------- App state --------------- */
let currentSeason = 'spring';
let currentConId = null;
let showLabels = false;
let activeAsterisms = new Set();
const ASTERISM_COLORS = ['#fbbf24', '#a78bfa'];

const seasonNav = document.getElementById('seasonNav');
const skymap = document.getElementById('skymap');
const conList = document.getElementById('conList');
const infoCard = document.getElementById('infoCard');
const seasonTitle = document.getElementById('seasonTitle');
const seasonSubtitle = document.getElementById('seasonSubtitle');
const tooltip = document.getElementById('tooltip');
const stage = document.querySelector('.stage');
const asterismToggles = document.getElementById('asterismToggles');

function buildNav(){
  seasonNav.innerHTML = '';
  Object.entries(SEASONS).forEach(([key, s]) => {
    const btn = document.createElement('button');
    btn.textContent = `${s.icon} ${s.label}`;
    btn.style.setProperty('--season-color', s.colorRaw);
    if(key===currentSeason) btn.classList.add('active');
    btn.addEventListener('click', () => {
      currentSeason = key;
      currentConId = null;
      activeAsterisms = new Set();
      render();
    });
    seasonNav.appendChild(btn);
  });
}

function renderAsterismToggles(){
  const s = SEASONS[currentSeason];
  asterismToggles.innerHTML = '';
  s.asterisms.forEach((ast, idx) => {
    const btn = document.createElement('button');
    btn.className = 'toggle-btn' + (activeAsterisms.has(idx) ? ' on' : '');
    btn.textContent = `${ast.name} 보기`;
    if(activeAsterisms.has(idx)){
      btn.style.background = ASTERISM_COLORS[idx % ASTERISM_COLORS.length];
      btn.style.color = '#05070f';
      btn.style.borderColor = 'transparent';
    }
    btn.addEventListener('click', () => {
      if(activeAsterisms.has(idx)) activeAsterisms.delete(idx);
      else activeAsterisms.add(idx);
      render();
    });
    asterismToggles.appendChild(btn);
  });
}

function findStar(season, refId){
  for(const c of season.constellations){
    const st = c.stars.find(s => s.id === refId);
    if(st) return st;
  }
  return null;
}

function renderMap(){
  const s = SEASONS[currentSeason];
  document.documentElement.style.setProperty('--season-color', s.colorRaw);
  stage.style.setProperty('--season-color', s.colorRaw);
  skymap.innerHTML = '';
  skymap.classList.toggle('show-labels', showLabels);

  // asterism guides (draw first, underneath)
  s.asterisms.forEach((asterism, idx) => {
    if(!activeAsterisms.has(idx)) return;
    const pts = asterism.points.map(([conId, starId]) => {
      const con = s.constellations.find(c=>c.id===conId);
      return con ? con.stars.find(st=>st.id===starId) : null;
    }).filter(Boolean);
    if(pts.length < 2) return;
    const color = ASTERISM_COLORS[idx % ASTERISM_COLORS.length];
    const d = pts.map((p,i)=> `${i===0?'M':'L'}${p.x},${p.y}`).join(' ') + ' Z';
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('class','asterism-line');
    path.setAttribute('stroke', color);
    skymap.appendChild(path);
    const cx = pts.reduce((a,p)=>a+p.x,0)/pts.length;
    const cy = pts.reduce((a,p)=>a+p.y,0)/pts.length;
    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', cx);
    label.setAttribute('y', cy);
    label.setAttribute('class','asterism-label');
    label.setAttribute('fill', color);
    label.setAttribute('text-anchor','middle');
    label.textContent = asterism.name;
    skymap.appendChild(label);
  });

  s.constellations.forEach(con => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','con-group' + (con.id===currentConId ? ' active' : ''));
    g.dataset.conId = con.id;

    con.lines.forEach(([a,b]) => {
      const sa = con.stars.find(st=>st.id===a);
      const sb = con.stars.find(st=>st.id===b);
      if(!sa || !sb) return;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', sa.x); line.setAttribute('y1', sa.y);
      line.setAttribute('x2', sb.x); line.setAttribute('y2', sb.y);
      line.setAttribute('class','con-line');
      g.appendChild(line);
    });

    con.stars.forEach(st => {
      const r = Math.max(2.2, 6 - st.mag*1.1);
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx', st.x); dot.setAttribute('cy', st.y); dot.setAttribute('r', r);
      dot.setAttribute('class','star-dot');
      dot.addEventListener('mousemove', (e) => showTooltip(e, `${st.name} · 등급 ${st.mag}`));
      dot.addEventListener('mouseleave', hideTooltip);
      g.appendChild(dot);

      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x', st.x + r + 4);
      label.setAttribute('y', st.y - r - 3);
      label.setAttribute('class','star-label');
      label.textContent = st.name;
      g.appendChild(label);
    });

    const anchor = con.stars[0];
    if(anchor){
      const nameLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
      nameLabel.setAttribute('x', anchor.x);
      nameLabel.setAttribute('y', anchor.y - 22);
      nameLabel.setAttribute('class','con-name-label');
      nameLabel.setAttribute('text-anchor','middle');
      nameLabel.textContent = con.name;
      g.appendChild(nameLabel);
    }

    g.addEventListener('click', () => {
      currentConId = con.id;
      render();
    });

    skymap.appendChild(g);
  });
}

function showTooltip(e, text){
  const rect = stage.getBoundingClientRect();
  tooltip.textContent = text;
  tooltip.style.left = (e.clientX - rect.left) + 'px';
  tooltip.style.top = (e.clientY - rect.top) + 'px';
  tooltip.classList.add('show');
}
function hideTooltip(){ tooltip.classList.remove('show'); }

function renderList(){
  const s = SEASONS[currentSeason];
  conList.innerHTML = '';
  s.constellations.forEach(con => {
    const item = document.createElement('div');
    item.className = 'con-item' + (con.id===currentConId ? ' active' : '');
    item.innerHTML = `<span class="kor">${con.name}</span><span class="eng">${con.nameEn}</span>`;
    item.addEventListener('click', () => { currentConId = con.id; render(); });
    conList.appendChild(item);
  });
}

function renderInfo(){
  const s = SEASONS[currentSeason];
  const con = s.constellations.find(c => c.id === currentConId);
  if(!con){
    infoCard.innerHTML = '<div class="placeholder">별자리를 선택하면<br>여기에 설명이 나타납니다 ✨</div>';
    return;
  }
  infoCard.innerHTML = `
    <h3>${con.name}</h3>
    <span class="eng-name">${con.nameEn}</span>
    <p class="desc">${con.desc}</p>
    <p class="myth">📜 ${con.myth}</p>
    ${con.deepsky ? `<p class="deepsky">🔭 볼거리: ${con.deepsky}</p>` : ''}
  `;
}

function renderHeader(){
  const s = SEASONS[currentSeason];
  seasonTitle.textContent = `${s.icon} ${s.title}`;
  seasonSubtitle.textContent = s.subtitle;
  seasonTitle.style.setProperty('--season-color', s.colorRaw);
}

function render(){
  buildNav();
  renderHeader();
  renderMap();
  renderList();
  renderInfo();
  renderAsterismToggles();
}

document.getElementById('toggleLabels').addEventListener('click', (e) => {
  showLabels = !showLabels;
  e.target.classList.toggle('on', showLabels);
  skymap.classList.toggle('show-labels', showLabels);
});

render();
